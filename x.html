<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>水水的X链接</title>
<style>
:root{
  --bg1:#0f1030;
  --bg2:#1b1f4b;
  --card:rgba(255,255,255,.06);
  --card-border:rgba(255,255,255,.12);
  --text:#f5f7ff;
  --muted:#aab0d6;
  --accent:#7c6cff;
  --accent2:#ff6ea9;
  --link:#6ea8ff;
  --radius:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:radial-gradient(1200px 800px at 15% 10%,#2a2f7a 0%,transparent 55%),
             radial-gradient(1000px 700px at 85% 90%,#5b1f6b 0%,transparent 55%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(16px,4vw,48px) clamp(12px,3vw,32px);
  overflow-x:hidden;
}
/* subtle floating orbs */
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;will-change:transform;animation:float 18s cubic-bezier(.45,.05,.55,.95) infinite}
.orb.a{width:300px;height:300px;top:-80px;left:-80px;background:radial-gradient(circle at 30% 30%,rgba(124,108,255,.85),rgba(124,108,255,0) 70%)}
.orb.b{width:260px;height:260px;bottom:-60px;right:-60px;background:radial-gradient(circle at 30% 30%,rgba(255,110,169,.8),rgba(255,110,169,0) 70%);animation-delay:-9s}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(18px,-30px,0)}}

.page{position:relative;z-index:1;width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vw,26px)}

/* Header */
.header{text-align:center;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.avatar{
  position:relative;
  width:clamp(86px,22vw,110px);height:clamp(86px,22vw,110px);
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:5px;
  box-shadow:0 12px 40px rgba(124,108,255,.4),0 0 0 4px rgba(255,255,255,.05);
}
.avatar::after{
  content:'';position:absolute;inset:-18px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(124,108,255,.5),rgba(255,110,169,.3) 45%,transparent 72%);
  animation:pulse 4.5s ease-in-out infinite;
  will-change:transform,opacity;
}
@keyframes pulse{0%,100%{transform:scale(.88);opacity:.55}50%{transform:scale(1.18);opacity:1}}
.avatar-inner{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#181a49,#2a1f5f);display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar-inner svg{width:56%;height:56%;color:#fff}
.title{font-size:clamp(24px,7vw,32px);font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#fff,#c9c2ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:clamp(12px,3.4vw,14px);color:var(--muted);max-width:340px;line-height:1.6}

/* Card */
.card{
  width:100%;
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding:clamp(14px,3vw,22px);
  box-shadow:0 24px 70px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:13px;
}
.btn{
  position:relative;
  display:flex;align-items:center;gap:14px;
  width:100%;
  padding:clamp(14px,3.4vw,17px) clamp(16px,4vw,20px);
  border-radius:16px;
  border:1px solid var(--card-border);
  background:rgba(255,255,255,.05);
  color:var(--text);
  text-decoration:none;
  cursor:pointer;
  transform:translateZ(0);
  will-change:transform;
  transition:transform .28s cubic-bezier(.22,1,.36,1),background .22s ease,border-color .22s ease,box-shadow .28s ease;
  text-align:left;
}
.btn:hover{
  transform:translate3d(0,-4px,0) scale(1.02);
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.28);
  box-shadow:0 14px 34px rgba(0,0,0,.32);
}
.btn:active{transform:translate3d(0,-1px,0) scale(.99)}
.btn .ic{
  width:clamp(30px,8vw,38px);height:clamp(30px,8vw,38px);
  flex:0 0 auto;
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;
}
.btn .ic svg{width:58%;height:58%}
.btn .txt{flex:1;min-width:0}
.btn .lbl{font-size:clamp(15px,4.2vw,17px);font-weight:600}
.btn .desc{font-size:clamp(11px,3vw,12.5px);color:var(--muted);margin-top:2px}
.btn .arrow{color:var(--muted);opacity:.6}
.btn .arrow svg{width:18px;height:18px;display:block}
/* gradient icon bg per button */
.b-grad1{background:linear-gradient(135deg,#7c6cff,#5b8cff)}
.b-grad2{background:linear-gradient(135deg,#ff6ea9,#ff9e6e)}
.b-grad3{background:linear-gradient(135deg,#ffc76e,#ff9e6e)}
.b-grad4{background:linear-gradient(135deg,#6effc7,#5fbaff)}
.b-grad5{background:linear-gradient(135deg,#a06bff,#ff6ea9)}

/* Footer */
.footer{text-align:center;font-size:clamp(11px,3vw,12.5px);color:var(--muted);padding:0 8px}
.footer .name{color:#c9c2ff;font-weight:600}
.footer .sv{opacity:.55}

/* Modal */
.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(8,8,26,.72);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;visibility:hidden;
  will-change:opacity;
  transition:opacity .3s ease,visibility .3s ease;
}
.overlay.show{opacity:1;visibility:visible}
.modal{
  width:100%;max-width:420px;
  background:linear-gradient(160deg,#20245b,#1a1d44);
  border:1px solid var(--card-border);
  border-radius:24px;
  padding:clamp(20px,5vw,26px);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  transform:translate3d(0,24px,0) scale(.95);
  transition:transform .42s cubic-bezier(.22,1,.36,1);
  will-change:transform;
  max-height:calc(100dvh - 40px);
  overflow:auto;
}
.overlay.show .modal{transform:translateY(0) scale(1)}
.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.modal-head .m-ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff}
.modal-head .m-ic svg{width:54%;height:54%}
.modal-head h2{font-size:20px;font-weight:700}
.modal-head .m-sub{font-size:12px;color:var(--muted)}
.close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.close:hover{background:rgba(255,255,255,.16)}
.close svg{width:16px;height:16px}

.follow-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.follow-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:12px 4px;text-decoration:none;color:var(--text);
  border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--card-border);
  transform:translateZ(0);
  will-change:transform;
  transition:transform .28s cubic-bezier(.22,1,.36,1),background .22s ease,box-shadow .28s ease;
  font-size:12px;font-weight:600;
}
.follow-item:hover{transform:translate3d(0,-4px,0);background:rgba(255,255,255,.1);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.follow-item .f-ic{width:clamp(40px,11vw,46px);height:clamp(40px,11vw,46px);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.follow-item .f-ic svg{width:52%;height:52%}

/* social brand colors */
.s-bili{background:linear-gradient(135deg,#00a1d6,#00c6c6)}
.s-dy{background:linear-gradient(135deg,#111,#3a3a3a);border:1px solid rgba(255,255,255,.18)}
.s-ks{background:linear-gradient(135deg,#ff4906,#ff8a00)}
.s-yt{background:linear-gradient(135deg,#ff0000,#ff5a5a)}
.s-x{background:linear-gradient(135deg,#1a1a1a,#444)}
.s-wa{background:linear-gradient(135deg,#25d366,#1fce7e)}
.s-tg{background:linear-gradient(135deg,#229ed9,#1d8ec2)}
.s-ig{background:radial-gradient(120%120% at 20%20%,#f09433 0%,#e6683c 30%,#dc2743 55%,#cc2366 75%,#bc1888 100%)}

@media(max-width:420px){
  .follow-grid{grid-template-columns:repeat(4,1fr);gap:9px}
  .follow-item{font-size:11px}
}
@media(min-width:1200px){
  .page{max-width:520px}
}
/* 尊重系统「减少动态效果」设置 */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
/* 页面入场：头部与卡片依次浮现 */
.header,.card,.footer{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
.card{animation-delay:.08s}
.footer{animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translate3d(0,18px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
</style>
</head>

<script>
/* =========================================================
   关注我 - 各大平台链接填写区
   在这里把对应的链接填进引号 " " 里面即可。
   例:  bilibili: "https://space.bilibili.com/你的uid"
   留空则点击时不会打开。填好后刷新即可生效。
   ========================================================= */
const FOLLOW_LINKS = {
  bilibili:   "https://b23.tv/FOKXFo4",
  douyin:     "https://v.douyin.com/tZ6AkGfNlIo/",
  kuaishou:   "https://www.kuaishou.com/search/%E6%B0%B4%E5%96%9D%E5%8D%83%E6%9D%9F?source=NewReco",
  youtube:    "https://youtube.com/@waterchisato?si=NJxULK-GajeGfitk",
  x:          "https://x.com/xishuishuiya",
  whatsapp:   "https://chat.whatsapp.com/DIZooSSWwWzFNG6wN2WWIc",
  telegram:   "https://waterchisato.t.me",
  instagram:  "https://www.instagram.com/waterchisato?igsi=MWEzZDZrbjd6Z3R5dQ=="
};

(function(){
  const overlay = document.getElementById('overlay');
  const openBtn = document.getElementById('followBtn');
  const closeBtn = document.getElementById('closeBtn');

  function open(){ overlay.classList.add('show'); document.body.style.overflow='hidden'; }
  function close(){ overlay.classList.remove('show'); document.body.style.overflow=''; }

  openBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });

  // apply follow links
  document.querySelectorAll('.follow-item').forEach(function(el){
    const key = el.getAttribute('data-social');
    const url = FOLLOW_LINKS[key] || '';
    el.setAttribute('href', url);
    if(!url){
      el.addEventListener('click', function(e){
        e.preventDefault();
        // 提示链接待填写
        el.querySelector('span:last-child').textContent = '待完善';
        setTimeout(function(){ el.querySelector('span:last-child').textContent = el.getAttribute('data-social')==='bilibili'?'b站'
          :el.getAttribute('data-social')==='douyin'?'抖音'
          :el.getAttribute('data-social')==='kuaishou'?'快手'
          :el.getAttribute('data-social')==='youtube'?'YouTube'
          :el.getAttribute('data-social')==='x'?'X'
          :el.getAttribute('data-social')==='whatsapp'?'WhatsApp'
          :el.getAttribute('data-social')==='telegram'?'Telegram'
          :'Instagram'; }, 1200);
      });
    }
  });
})();
</script>
