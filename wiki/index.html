<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>心灵指南 Wiki · 心理健康与急救知识库</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --primary-dark: #1e40af;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --bg: #f8fafc;
    --card: #ffffff;
    --sidebar-w: 260px;
    --radius: 10px;
    --shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1);
    --shadow-hover: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
  }
  
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    font-size: 15px;
    display: flex;
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }

  /* 通用 SVG 图标样式 */
  .svg-icon {
    width: 18px;
    height: 18px;
    fill: currentColor;
    flex-shrink: 0;
  }

  /* 侧边栏 Wiki Sidebar */
  .sidebar {
    width: var(--sidebar-w);
    background: #fff;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 100;
  }
  .sidebar-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 28px;
    height: 28px;
    background: var(--primary);
    color: #fff;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
  }
  .sidebar-menu {
    padding: 16px;
    flex: 1;
    overflow-y: auto;
  }
  .menu-group {
    margin-bottom: 20px;
  }
  .menu-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.5px;
    padding: 0 12px 8px;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    color: #334155;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s;
    cursor: pointer;
  }
  .menu-item:hover, .menu-item.active {
    background: var(--primary-light);
    color: var(--primary);
  }
  .sidebar-footer {
    padding: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }

  /* 主内容区 Outer */
  .main-wrapper {
    margin-left: var(--sidebar-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* 顶部搜索栏 Header */
  .top-header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 12px 32px;
    position: sticky;
    top: 0;
    z-index: 90;
    display: flex;
    align-items: center;
  }
  .search-box {
    position: relative;
    max-width: 400px;
    width: 100%;
  }
  .search-input {
    width: 100%;
    padding: 8px 12px 8px 36px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus {
    border-color: var(--primary);
    background: #fff;
  }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    display: flex;
    align-items: center;
  }

  /* 内容区 Content */
  .content {
    padding: 32px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }

  .wiki-hero {
    margin-bottom: 24px;
  }
  .wiki-hero h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .wiki-hero p {
    color: var(--muted);
    margin: 0;
    font-size: 15px;
  }

  /* Status Bar */
  .status-bar {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    box-shadow: var(--shadow);
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    background: #e0f2fe;
    color: #0369a1;
  }

  /* 知识卡片网格 Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .wiki-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.2s ease;
    position: relative;
  }
  .wiki-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    border-color: #cbd5e1;
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 12px;
  }
  .card-icon {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    flex-shrink: 0;
  }
  .card-icon .svg-icon {
    width: 22px;
    height: 22px;
  }
  .card-header {
    flex: 1;
    min-width: 0;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-light);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #94a3b8;
    border-top: 1px dashed var(--line);
    padding-top: 12px;
  }
  .card-footer .file-name {
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 180px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-footer .read-btn {
    color: var(--primary);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  /* Empty state */
  .empty-block {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    color: var(--muted);
  }

  footer {
    padding: 24px 0;
    color: var(--muted);
    font-size: 13px;
    border-top: 1px solid var(--line);
    margin-top: auto;
  }
  footer a {
    color: var(--primary);
    font-weight: 600;
  }
  footer a:hover {
    text-decoration: underline;
  }

  /* 响应式调整 */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main-wrapper { margin-left: 0; }
    .content { padding: 16px; }
  }
</style>
</head>
<body>

  <!-- SVG 图标库声明（隐藏） -->
  <svg style="display: none;">
    <!-- 搜索 -->
    <symbol id="icon-search" viewBox="0 0 24 24">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </symbol>
    <!-- 📚 知识库 -->
    <symbol id="icon-book" viewBox="0 0 24 24">
      <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
    </symbol>
    <!-- 🏷️ 标签/分类 -->
    <symbol id="icon-tag" viewBox="0 0 24 24">
      <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM13 20l-9-9V4h7l9 9-7 7z"/><circle cx="6.5" cy="6.5" r="1.5"/>
    </symbol>
    <!-- 🧠 大脑/心理 -->
    <symbol id="icon-brain" viewBox="0 0 24 24">
      <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.2 19.57 10.55 20 12 20s2.8-.43 4.34-1.09l1.9 1.9c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41l-.62-1.79C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
    </symbol>
    <!-- 🚑 紧急/医疗 -->
    <symbol id="icon-medical" viewBox="0 0 24 24">
      <path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/>
    </symbol>
    <!-- 🏳️‍⚧️ 性别/认同 -->
    <symbol id="icon-gender" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
    </symbol>
    <!-- 📄 文件 -->
    <symbol id="icon-file" viewBox="0 0 24 24">
      <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
    </symbol>
    <!-- 箭头 -->
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
    </symbol>
  </svg>

  <!-- 左侧 Wiki 导航栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">W</div>
        <span>心灵指南 Wiki</span>
      </div>
    </div>
    <div class="sidebar-menu">
      <div class="menu-group">
        <div class="menu-title">浏览知识库</div>
        <a class="menu-item active" onclick="filterCategory('all', this)">
          <svg class="svg-icon"><use href="#icon-book"/></svg> 词条索引
        </a>
      </div>
      <div class="menu-group">
        <div class="menu-title">快捷分类</div>
        <a class="menu-item" onclick="filterCategory('跨性别', this)">
          <svg class="svg-icon"><use href="#icon-gender"/></svg> 跨性别
        </a>
        <a class="menu-item" onclick="filterCategory('情绪障碍', this)">
          <svg class="svg-icon"><use href="#icon-brain"/></svg> 心理与情绪障碍
        </a>
        <a class="menu-item" onclick="filterCategory('急救', this)">
          <svg class="svg-icon"><use href="#icon-medical"/></svg> 中毒与生理急救
        </a>
      </div>
    </div>
    <div class="sidebar-footer">
      <div>共包含 <b id="docCount">0</b> 个指南词条</div>
      <div style="margin-top:4px">公益心理健康科普</div>
    </div>
  </aside>

  <!-- 右侧主内容区 -->
  <div class="main-wrapper">
    <!-- 顶部搜索栏 Header -->
    <header class="top-header">
      <div class="search-box">
        <span class="search-icon">
          <svg class="svg-icon"><use href="#icon-search"/></svg>
        </span>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索 Wiki 词条或关键字..." oninput="handleSearch()">
      </div>
    </header>

    <!-- 实际内容 -->
    <main class="content">
      <div class="wiki-hero">
        <h1>心灵指南 · 心理健康与急救知识库</h1>
        <p>收录关于心理健康、跨性别认同、精神疾病常识与生理现场急救的开源 Wiki 科普指南。</p>
      </div>

      <!-- 状态提示 -->
      <div class="status-bar">
        <span class="badge">已就绪</span>
        <span style="color: var(--muted)">知识库已载入 <b id="statusCount" style="color:var(--ink)">0</b> 个 Wiki 词条</span>
      </div>

      <!-- 词条卡片网格 -->
      <div class="grid" id="grid"></div>

      <!-- 空状态 -->
      <div class="empty-block" id="emptyBlock" style="display:none">
        未找到相关的词条内容
      </div>

      <footer>
        <div>免责声明：本站所有内容均为公益科普，<b>不能替代专业医疗诊断与临床治疗</b>。如遇急诊或严重心理危机，请立即前往正规医院就诊或拨打急救电话。</div>
        <div style="margin-top: 8px;">
          维护者 · <a href="https://chisato.org.cn" target="_blank" rel="noopener noreferrer">水喝千束</a>
        </div>
      </footer>
    </main>
  </div>

<script>
let rawData = [];
let currentData = [];

/* 渲染卡片列表 */
function renderGrid(items){
  const grid = document.getElementById("grid");
  const emptyBlock = document.getElementById("emptyBlock");
  grid.innerHTML = "";

  if(!items || !items.length){
    emptyBlock.style.display = "block";
    return;
  }
  emptyBlock.style.display = "none";

  items.forEach(it => {
    const card = document.createElement("a");
    card.className = "wiki-card";
    card.href = encodeURI(it.file);
    card.innerHTML = `
      <div>
        <div class="card-top">
          <div class="card-icon">
            <svg class="svg-icon"><use href="${it.iconSymbol || '#icon-file'}"/></svg>
          </div>
          <div class="card-header">
            <div class="card-title">${it.title}</div>
            <span class="card-tag">${it.tag || "指南"}</span>
          </div>
        </div>
        <div class="card-desc">${it.desc || "点击阅读详情..."}</div>
      </div>
      <div class="card-footer">
        <span class="file-name">
          <svg class="svg-icon" style="width:14px;height:14px;"><use href="#icon-file"/></svg>
          ${it.file}
        </span>
        <span class="read-btn">
          阅读词条
          <svg class="svg-icon" style="width:14px;height:14px;"><use href="#icon-arrow-right"/></svg>
        </span>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* 实时搜索过滤 */
function handleSearch(){
  const query = document.getElementById("searchInput").value.toLowerCase().trim();
  const filtered = currentData.filter(it => 
    it.title.toLowerCase().includes(query) || 
    it.file.toLowerCase().includes(query) ||
    (it.tag && it.tag.toLowerCase().includes(query)) ||
    (it.desc && it.desc.toLowerCase().includes(query))
  );
  renderGrid(filtered);
}

/* 侧边栏分类过滤 */
function filterCategory(cat, el){
  if(el){
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    el.classList.add('active');
  }

  if(cat === 'all') {
    currentData = [...rawData];
  } else {
    currentData = rawData.filter(it => it.tag === cat);
  }
  
  handleSearch();
}

/* 动态读取同目录下的 data.json */
async function loadJsonData(){
  const emptyBlock = document.getElementById("emptyBlock");
  try {
    const res = await fetch('./data.json', { cache: "no-store" });
    if (!res.ok) throw new Error("无法读取 data.json");
    
    rawData = await res.json();
    currentData = [...rawData];

    const count = rawData.length;
    document.getElementById("docCount").textContent = count;
    document.getElementById("statusCount").textContent = count;
    
    renderGrid(rawData);
  } catch (err) {
    console.error("加载 data.json 失败:", err);
    emptyBlock.style.display = "block";
    emptyBlock.innerHTML = `⚠️ <b>读取 data.json 失败</b><br><span style="font-size:12px;color:var(--muted)">请确保同目录下存在 data.json 文件，且通过 Web 服务器访问。</span>`;
  }
}

// 启动页面时读取 JSON
loadJsonData();
</script>
</body>
</html>
